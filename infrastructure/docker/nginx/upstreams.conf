# Upstream pools. Each service is resolved through the Docker DNS at runtime,
# so a recreated container with a new IP needs no nginx reload.

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:3000 resolve;
    }

    upstream graphql_upstream {
        zone graphql_upstream 64k;
        server graphql:3000 resolve;
    }

    upstream rwa_upstream {
        zone rwa_upstream 64k;
        server rwa:3000 resolve;
    }

    upstream auth_upstream {
        zone auth_upstream 64k;
        server auth:3000 resolve;
    }

    upstream upload_upstream {
        zone upload_upstream 64k;
        server upload:3000 resolve;
    }

    upstream authelia_upstream {
        zone authelia_upstream 64k;
        server authelia:9091 resolve;
    }

    upstream lldap_upstream {
        zone lldap_upstream 64k;
        server lldap:17170 resolve;
    }

    upstream homer_upstream {
        zone homer_upstream 64k;
        server homer:8080 resolve;
    }

    upstream rabbitmq_upstream {
        zone rabbitmq_upstream 64k;
        server rabbitmq:15672 resolve;
    }

    upstream mongo_express_upstream {
        zone mongo_express_upstream 64k;
        server mongo_express:8081 resolve;
    }

    upstream redisinsight_upstream {
        zone redisinsight_upstream 64k;
        server redisinsight:5540 resolve;
    }

    upstream portainer_upstream {
        zone portainer_upstream 64k;
        server portainer:9000 resolve;
    }

    upstream grafana_upstream {
        zone grafana_upstream 64k;
        server grafana:3000 resolve;
    }

    upstream prometheus_upstream {
        zone prometheus_upstream 64k;
        server prometheus:9090 resolve;
    }

    upstream alertmanager_upstream {
        zone alertmanager_upstream 64k;
        server alertmanager:9093 resolve;
    }

    upstream uptime_kuma_upstream {
        zone uptime_kuma_upstream 64k;
        server uptime-kuma:3001 resolve;
    }

    upstream docs_upstream {
        zone docs_upstream 64k;
        server docs:3000 resolve;
    }

    upstream alloy_upstream {
        zone alloy_upstream 64k;
        server alloy:12345 resolve;
    }
