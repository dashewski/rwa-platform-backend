      context: ../..
      dockerfile: services/signer/Dockerfile
    environment:
      <<: [*monitoring-env, *rabbit-env]
      SERVICE_NAME: ${SIGNER_3_SERVICE_NAME}
      SERVICE_VERSION: ${SIGNER_3_SERVICE_VERSION}
      PORT: ${SIGNER_3_PORT}
      SIGNER_PRIVATE_KEY: ${SIGNER_3_PRIVATE_KEY}
    volumes: *monitoring-volumes
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  signers-manager:
    container_name: signers-manager
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/signers-manager/Dockerfile
    environment:
      <<: [*monitoring-env, *mongo-env, *rabbit-env]
      SERVICE_NAME: ${SIGNERS_MANAGER_SERVICE_NAME}
      SERVICE_VERSION: ${SIGNERS_MANAGER_SERVICE_VERSION}
      MONGODB_DBNAME: ${SIGNERS_MANAGER_MONGODB_DBNAME}
      PORT: ${SIGNERS_MANAGER_PORT}
      RABBITMQ_EXCHANGE: ${RABBITMQ_BLOCKCHAIN_EVENTS_EXCHANGE}
    volumes: *monitoring-volumes
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  testnet-faucet:
    container_name: testnet-faucet
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/testnet-faucet/Dockerfile
    environment:
      <<: [*monitoring-env, *mongo-env]
      SERVICE_NAME: ${TESTNET_FAUCET_SERVICE_NAME}
      SERVICE_VERSION: ${TESTNET_FAUCET_SERVICE_VERSION}
      MONGODB_DBNAME: ${TESTNET_FAUCET_MONGODB_DBNAME}
      PORT: ${TESTNET_FAUCET_PORT}
      PROVIDER_URL: ${BLOCKCHAIN_PROVIDER_URL}
      WALLET_PRIVATE_KEY: ${TESTNET_FAUCET_WALLET_PRIVATE_KEY}
      GAS_TOKEN_AMOUNT: ${TESTNET_FAUCET_GAS_TOKEN_AMOUNT}
      HOLD_TOKEN_AMOUNT: ${TESTNET_FAUCET_HOLD_TOKEN_AMOUNT}
      PLATFORM_TOKEN_AMOUNT: ${TESTNET_FAUCET_PLATFORM_TOKEN_AMOUNT}
      REQUEST_GAS_DELAY_MS: ${TESTNET_FAUCET_REQUEST_GAS_DELAY_MS}
      REQUEST_HOLD_DELAY_MS: ${TESTNET_FAUCET_REQUEST_HOLD_DELAY_MS}
      REQUEST_PLATFORM_DELAY_MS: ${TESTNET_FAUCET_REQUEST_PLATFORM_DELAY_MS}
      HOLD_TOKEN_ADDRESS: ${HOLD_TOKEN_ADDRESS}
      PLATFORM_TOKEN_ADDRESS: ${PLATFORM_TOKEN_ADDRESS}
    volumes: *monitoring-volumes
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy

  nginx:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infrastructure/docker/nginx/Dockerfile
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_SSL_PORT}:443"
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
      - NGINX_SSL_CERT_PATH=${NGINX_SSL_CERT_PATH}
      - NGINX_SSL_KEY_PATH=${NGINX_SSL_KEY_PATH}
      - DOCUMENTS_MAX_FILE_SIZE=${DOCUMENTS_MAX_FILE_SIZE}
      - GALLERY_MAX_FILE_SIZE=${GALLERY_MAX_FILE_SIZE}
      - TOKEN_IMAGE_MAX_FILE_SIZE=${TOKEN_IMAGE_MAX_FILE_SIZE}
      - FILES_URL_PATH=${FILES_URL_PATH}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ${NGINX_HOST_SSL_CERT_PATH}:${NGINX_SSL_CERT_PATH}:ro
      - ${NGINX_HOST_SSL_KEY_PATH}:${NGINX_SSL_KEY_PATH}:ro
      - nginx_logs:/var/log/nginx
      - files_storage:/app/storage
      - ./nginx/static:/usr/share/nginx/html/static:ro
    networks:
      - app-network

  mongodb:
    restart: unless-stopped
    image: mongo:8.3.11
    # Member of the 3-node replica set `rs0` (multi-document transactions and
    # automatic failover). Bring the stack up via `bun run app:up`
    # (`deployments/scripts/app-up.ts`) — it initiates/verifies the set with
    # the one-shot helper before the rest of the stack starts.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      # The replica set config exists and is usable (initiation is a separate script run)
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          let ok=false; try { ok = rs.status().ok === 1; } catch (e) { ok=false; } if(!ok){ throw new Error('replica set is not ready'); }
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - app-network

  mongodb-2:
    restart: unless-stopped
    image: mongo:8.3.11
    # Member of the 3-node replica set `rs0` (see `mongodb`).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb2_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          let ok=false; try { ok = rs.status().ok === 1; } catch (e) { ok=false; } if(!ok){ throw new Error('replica set is not ready'); }
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - app-network

  mongodb-3:
    restart: unless-stopped
    image: mongo:8.3.11
    # Member of the 3-node replica set `rs0` (see `mongodb`).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb3_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          let ok=false; try { ok = rs.status().ok === 1; } catch (e) { ok=false; } if(!ok){ throw new Error('replica set is not ready'); }
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - app-network

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    environment:
      MONGODB_URI: ${MONGODB_BASE_URI}
      MONGODB_EXPORTER_PORT: "9216"
    command:
      - '--mongodb.global-conn-pool'
      - '--compatible-mode'
      - '--collect-all'
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy

  mongo_express:
    restart: unless-stopped
    image: mongo-express:1.0.2
    environment:
      ME_CONFIG_MONGODB_SERVER: "mongodb"
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_BASICAUTH_USERNAME: ""
      ME_CONFIG_BASICAUTH_PASSWORD: ""
    depends_on:
      - mongodb
    networks:
      - app-network

  redis:
    restart: unless-stopped
    image: redis:8.10.2
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy

  redisinsight:
    restart: unless-stopped
    image: redis/redisinsight:3.8.0
    environment:
      - REDISINSIGHT_HOST=0.0.0.0
      - RI_APP_PORT=5540
    volumes:
      - redisinsight_data:/data
    networks:
      - app-network
    depends_on:
      - redis

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  # Monitoring Stack
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
      - '--web.external-url=https://prometheus.${BASE_DOMAIN}/'
      - '--web.route-prefix=/'
    networks:
      - app-network

  alertmanager:
    container_name: alertmanager
    restart: unless-stopped
    image: prom/alertmanager:v0.34.1
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      BASE_DOMAIN: ${BASE_DOMAIN}
    volumes:
      - ./alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    # Renders the config from env (Alertmanager has no native env substitution),
    # see infrastructure/docker/alertmanager/entrypoint.sh
    entrypoint:
      - /bin/sh
      - /entrypoint.sh
    networks:
      - app-network

  loki:
    restart: unless-stopped
    image: grafana/loki:3.7.8
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network

  tempo:
    restart: unless-stopped
    image: grafana/tempo:3.0.2
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/tempo.yaml
    networks:
      - app-network

  grafana:
    restart: unless-stopped
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "${GRAFANA_ALLOW_SIGN_UP}"
      GF_SERVER_ROOT_URL: "https://grafana.${BASE_DOMAIN}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "Remote-User"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    networks:
      - app-network
    depends_on:
      - prometheus
      - loki
      - tempo

  alloy:
    restart: unless-stopped
    image: grafana/alloy:v1.20.1
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - service_logs:/var/log
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    networks:
      - app-network
    depends_on:
      - prometheus
      - loki
      - tempo

  # System monitoring
  node-exporter:
    restart: unless-stopped
    image: prom/node-exporter:v1.12.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - app-network

  cadvisor:
    restart: unless-stopped
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - app-network

  portainer:
    image: portainer/portainer-ce:2.45.1
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - app-network

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17
    container_name: uptime-kuma
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  authelia:
    image: authelia/authelia:4.39.28
    container_name: authelia
    environment:
      - LLDAP_USER_PASS=${LLDAP_ADMIN_PASSWORD}
      - LLDAP_BASE_DN=${LLDAP_BASE_DN}
      - BASE_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ./authelia/config/configuration.yml.template:/config/configuration.yml.template:ro
      - ./authelia/config/notification.txt:/config/notification.txt
      - ./authelia/secrets:/secrets
      - authelia_data:/data
    entrypoint: /bin/sh -c "sed \"s|\\$$BASE_DOMAIN|$$BASE_DOMAIN|g; s|\\$$LLDAP_USER_PASS|$$LLDAP_USER_PASS|g; s|\\$$LLDAP_BASE_DN|$$LLDAP_BASE_DN|g\" /config/configuration.yml.template > /config/configuration.yml && authelia --config /config/configuration.yml"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      lldap:
        condition: service_healthy

  lldap:
    image: lldap/lldap:v0.6.3-alpine
    container_name: lldap
    environment:
      - LLDAP_JWT_SECRET_FILE=/secrets/LLDAP_JWT_SECRET
      - LLDAP_LDAP_BASE_DN=${LLDAP_BASE_DN}
      - LLDAP_LDAP_USER_PASS=${LLDAP_ADMIN_PASSWORD}
    volumes:
      - lldap_data:/data
      - ./authelia/secrets:/secrets:ro
    networks:
      - app-network
    restart: unless-stopped

  homer:
    image: b4bz/homer:v26.08.3
    container_name: homer
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ./homer/config.yml.template:/www/assets/config.yml.template:ro
    entrypoint: /bin/sh -c "sed \"s/\\$${BASE_DOMAIN}/$BASE_DOMAIN/g\" /www/assets/config.yml.template > /www/assets/config.yml && sh /entrypoint.sh"
    networks:
      - app-network
    user: "1000:1000"
    restart: unless-stopped

volumes:
  redis_data:
  redisinsight_data:
  docs_data:
  service_logs:
  rabbitmq_data:
  mongodb_data:
  mongodb2_data:
  mongodb3_data:
  nginx_logs:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  tempo_data:
  portainer_data:
  uptime_kuma_data:
  authelia_data:
  lldap_data:
  files_storage:

networks:
  app-network:
    name: app-network
    driver: bridge
