      OTEL_RESOURCE_ATTRIBUTES: service.name=${AUTH_SERVICE_NAME},service.version=${AUTH_SERVICE_VERSION},deployment.environment=${DEPLOYMENT_ENVIRONMENT}
      PORT: ${AUTH_PORT}
      JWT_SECRET: ${APP_JWT_SECRET}
      ACCESS_TOKEN_EXPIRY: ${AUTH_ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${AUTH_REFRESH_TOKEN_EXPIRY}
      DOMAIN_NAME: ${AUTH_DOMAIN_NAME}
      DOMAIN_VERSION: ${AUTH_DOMAIN_VERSION}
