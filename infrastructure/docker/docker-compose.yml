
version: "3.8"

x-configs:
  monitoring:
    env: &monitoring-env
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
    volumes: &monitoring-volumes
      - service_logs:/var/log
  
  infra:
    rabbit-env: &rabbit-env
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_RECONNECT_INTERVAL: ${RABBITMQ_RECONNECT_INTERVAL}
      RABBITMQ_MAX_RECONNECT_ATTEMPTS: ${RABBITMQ_MAX_RECONNECT_ATTEMPTS}
    
    mongo-env: &mongo-env
      MONGODB_URI: ${MONGODB_BASE_URI}
    
    openrouter-env: &openrouter-env
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}

services:
  ai-assistant:
    container_name: ai-assistant
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/ai-assistant/Dockerfile
    environment:
      <<: [*mongo-env, *monitoring-env, *openrouter-env]
      SERVICE_NAME: ${AI_ASSISTANT_SERVICE_NAME}
      SERVICE_VERSION: ${AI_ASSISTANT_SERVICE_VERSION}
      MONGODB_DBNAME: ${AI_ASSISTANT_MONGODB_DBNAME}
      OTEL_SERVICE_NAME: ${AI_ASSISTANT_SERVICE_NAME}
      OTEL_RESOURCE_ATTRIBUTES: service.name=${AI_ASSISTANT_SERVICE_NAME},service.version=${AI_ASSISTANT_SERVICE_VERSION},deployment.environment=${DEPLOYMENT_ENVIRONMENT}
      PORT: ${AI_ASSISTANT_PORT}
      RWA_SERVICE_URL: ${RWA_SERVICE_URL}
      PORTFOLIO_SERVICE_URL: ${PORTFOLIO_SERVICE_URL}
    volumes: *monitoring-volumes
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy

  ai-evaluator:
    container_name: ai-evaluator
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/ai-evaluator/Dockerfile
    environment:
      <<: [*mongo-env, *monitoring-env, *openrouter-env, *rabbit-env]
      SERVICE_NAME: ${AI_EVALUATOR_SERVICE_NAME}
      SERVICE_VERSION: ${AI_EVALUATOR_SERVICE_VERSION}
      MONGODB_DBNAME: ${AI_EVALUATOR_MONGODB_DBNAME}
      OTEL_SERVICE_NAME: ${AI_EVALUATOR_SERVICE_NAME}
      OTEL_RESOURCE_ATTRIBUTES: service.name=${AI_EVALUATOR_SERVICE_NAME},service.version=${AI_EVALUATOR_SERVICE_VERSION},deployment.environment=${DEPLOYMENT_ENVIRONMENT}
      PORT: ${AI_EVALUATOR_PORT}
      RWA_SERVICE_URL: ${RWA_SERVICE_URL}
      DOCUMENTS_SERVICE_URL: ${DOCUMENTS_SERVICE_URL}
      GALLERY_SERVICE_URL: ${GALLERY_SERVICE_URL}
      REACTIONS_SERVICE_URL: ${REACTIONS_SERVICE_URL}
      QUESTIONS_SERVICE_URL: ${QUESTIONS_SERVICE_URL}
      PORTFOLIO_SERVICE_URL: ${PORTFOLIO_SERVICE_URL}
    volumes: *monitoring-volumes
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-keys:
    container_name: api-keys
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/api-keys/Dockerfile
    environment:
      <<: [*mongo-env, *monitoring-env]
      SERVICE_NAME: ${API_KEYS_SERVICE_NAME}
      SERVICE_VERSION: ${API_KEYS_SERVICE_VERSION}
      MONGODB_DBNAME: ${API_KEYS_MONGODB_DBNAME}
      OTEL_SERVICE_NAME: ${API_KEYS_SERVICE_NAME}
      OTEL_RESOURCE_ATTRIBUTES: service.name=${API_KEYS_SERVICE_NAME},service.version=${API_KEYS_SERVICE_VERSION},deployment.environment=${DEPLOYMENT_ENVIRONMENT}
      PORT: ${API_KEYS_PORT}
    volumes: *monitoring-volumes
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy

  webhooks:
    container_name: webhooks
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/webhooks/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: [*mongo-env, *monitoring-env, *rabbit-env]
      SERVICE_NAME: ${WEBHOOKS_SERVICE_NAME}
      SERVICE_VERSION: ${WEBHOOKS_SERVICE_VERSION}
      MONGODB_DBNAME: ${WEBHOOKS_MONGODB_DBNAME}
      OTEL_SERVICE_NAME: ${WEBHOOKS_SERVICE_NAME}
      OTEL_RESOURCE_ATTRIBUTES: service.name=${WEBHOOKS_SERVICE_NAME},service.version=${WEBHOOKS_SERVICE_VERSION},deployment.environment=${DEPLOYMENT_ENVIRONMENT}
      PORT: ${WEBHOOKS_PORT}
      REDIS_URL: ${REDIS_URL}
      WEBHOOKS_ENCRYPTION_KEY: ${WEBHOOKS_ENCRYPTION_KEY}
      # Dev stand only: webhook egress exemptions. The e2e receiver
      # (tests/webhooks.test.ts) runs on the Docker host and is reached as
      # host.docker.internal. Keep empty / unset on production hosts.
      SSRF_ALLOWED_HOSTS: ${WEBHOOKS_SSRF_ALLOWED_HOSTS:-}
      # Keep TLS verification on for outbound webhook deliveries by default;
      # set NODE_TLS_REJECT_UNAUTHORIZED=0 explicitly only in dev/test envs.
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}
    volumes: *monitoring-volumes
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

