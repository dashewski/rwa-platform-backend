enum EvaluationEntityType {
  business
  pool
}

type EvaluationSource {
  type: String!
  id: String!
  name: String!
  mimeType: String!
}

type EvaluationRisk {
  score: Int
  pros: [String!]!
  cons: [String!]!
}

type Evaluation {
  id: ID!
  entityType: EvaluationEntityType!
  parentId: String!
  grandParentId: String
  ownerId: String
  ownerType: String
  risk: EvaluationRisk!
  summary: String
  sources: [EvaluationSource!]!
  modelUsed: String
  completed: Boolean!
  completedAt: Float
  createdAt: Float!
  updatedAt: Float!
}

input EvaluationFilterInput {
  entityType: EvaluationEntityType
  parentId: String
  grandParentId: String
  ownerId: String
}

input EvaluationSortInput {
  createdAt: String
  riskScore: String
}

input GetEvaluationsInput {
  filter: EvaluationFilterInput
  sort: EvaluationSortInput
  limit: Int
  offset: Int
}

extend type Query {
  getEvaluation(id: ID!): Evaluation!
  getEvaluations(input: GetEvaluationsInput): [Evaluation!]!
}

extend type Mutation {
  requestBusinessEvaluation(id: ID!): ID!
  requestPoolEvaluation(id: ID!): ID!
}
