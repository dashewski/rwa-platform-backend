scalar JSON

type Staking {
  id: ID!
  staker: String!
  amount: String!
  unlockTimestamp: Float!
  lastStakeTimestamp: Float!
  chainId: String!
  createdAt: Float!
  updatedAt: Float!
}

type Proposal {
  id: ID!
  proposalId: String!
  proposer: String!
  target: String!
  data: String!
  description: String!
  creationTime: Float!
  endTime: Float!
  state: String!
  executor: String
  canceller: String
  chainId: String!
  transactionHash: String!
  logIndex: Float!
  createdAt: Float!
  updatedAt: Float!
}

type Vote {
  id: ID!
  proposalId: String!
  chainId: String!
  governanceAddress: String!
  voterWallet: String!
  support: Boolean!
  weight: String!
  reason: String!
  transactionHash: String!
  logIndex: Float!
  blockNumber: Float!
  createdAt: Float!
  updatedAt: Float!
}

type StakingHistory {
  id: ID!
  staker: String!
  amount: String!
  rewards: String!
  operation: String!
  chainId: String!
  transactionHash: String!
  logIndex: Float!
  blockNumber: Float
  createdAt: Float!
  updatedAt: Float!
}

type TimelockTask {
  id: ID!
  txHash: String!
  target: String!
  data: String!
  eta: Float!
  executed: Boolean!
  cancelled: Boolean!
  chainId: String!
  transactionHash: String
  logIndex: Float
  blockNumber: Float
  createdAt: Float!
  updatedAt: Float!
}

type TreasuryWithdraw {
  id: ID!
  recipient: String!
  token: String!
  isNative: Boolean!
  amount: String!
  chainId: String!
  transactionHash: String!
  logIndex: Float!
  createdAt: Float!
  updatedAt: Float!
}

input GetStakingFilterInput {
  filter: JSON
  sort: JSON
  limit: Int
  offset: Int
}

input GetProposalsFilterInput {
  filter: JSON
  sort: JSON
  limit: Int
  offset: Int
}

input GetVotesFilterInput {
  filter: JSON
  sort: JSON
  limit: Int
  offset: Int
}

input GetStakingHistoryFilterInput {
  filter: JSON
  sort: JSON
  limit: Int
  offset: Int
}

input GetTimelockTasksFilterInput {
  filter: JSON
  sort: JSON
  limit: Int
  offset: Int
}

input GetTreasuryWithdrawsFilterInput {
  filter: JSON
  sort: JSON
  limit: Int
  offset: Int
}

extend type Query {
  getStaking(input: GetStakingFilterInput): [Staking!]!
  getProposals(input: GetProposalsFilterInput): [Proposal!]!
  getVotes(input: GetVotesFilterInput): [Vote!]!
  getStakingHistory(input: GetStakingHistoryFilterInput): [StakingHistory!]!
  getTimelockTasks(input: GetTimelockTasksFilterInput): [TimelockTask!]!
  getTreasuryWithdraws(input: GetTreasuryWithdrawsFilterInput): [TreasuryWithdraw!]!
}